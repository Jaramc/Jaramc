name: pacman

on:
  schedule:
    # Todos los días a las 00:30 UTC (19:30 del día anterior en Colombia)
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pacman-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar el grafo de Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Jaramc

      - name: Listar artefactos generados
        run: ls -la dist

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
