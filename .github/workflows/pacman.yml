name: pacman

on:
  schedule:
    # Todos los días a las 00:30 UTC (19:30 del día anterior en Colombia)
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pacman-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Generar el grafo de Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Jaramc
          games: "pacman"

      - name: Listar los SVG generados
        run: ls -la dist

      - name: Publicar los SVG en la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
